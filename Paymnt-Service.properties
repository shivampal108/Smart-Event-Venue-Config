

server.port=1239

eureka.client.service-url.default-zone=http://localhost:8761/eureka/
management.endpoints.web.exposure.include=*
spring.boot.admin.client.instance.service-host-type=IP
eureka.instance.hostname=localhost
eureka.instance.prefer-ip-address=true



spring.boot.admin.client.url=http://localhost:1111


# support patch in post mapping
spring.cloud.openfeign.httpclient.hc5.enabled=true

#db


#spring.datasource.url=jdbc:mysql:///ms-db
spring.datasource.url=jdbc:mysql://localhost:3306/ms-db


spring.datasource.username=root

spring.datasource.password=Shivam@22

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


#kafka

spring.kafka.bootstrap-servers=localhost:9092

spring.kafka.consumer.group-id=refund-group
spring.kafka.consumer.auto-offset-reset=earliest

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

spring.kafka.consumer.properties.spring.json.trusted.packages=com.paymnt.dto
spring.kafka.consumer.properties.spring.json.use.type.headers=false
